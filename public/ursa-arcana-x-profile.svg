<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Ursa Arcana profile image</title>
  <desc id="desc">The geometric Ursa Arcana bear sigil on a minimal blue-white field.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".58" stop-color="#edf3fa"/>
      <stop offset="1" stop-color="#dce9f7"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#8abdec" stop-opacity=".3"/>
      <stop offset=".58" stop-color="#8abdec" stop-opacity=".1"/>
      <stop offset="1" stop-color="#8abdec" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="17" flood-color="#203958" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#background)"/>
